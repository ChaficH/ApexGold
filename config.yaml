# ==============================================================================
# ApexGold Master Configuration
# Algorithmic Trading Platform for Gold (XAUUSD) & High-Liquidity Majors
# ==============================================================================

system:
  app_name: "ApexGold Trading Engine"
  version: "1.0.0"
  environment: "production" # "development" or "production"
  log_level: "INFO" # DEBUG, INFO, WARNING, ERROR

# ------------------------------------------------------------------------------
# Broker Adapter Configuration
# ------------------------------------------------------------------------------
broker:
  # Active adapter options:
  #   - "paper_sim"       : Real-time paper simulator with live/synthetic tick engine (works out-of-the-box)
  #   - "mt5_mac_socket"  : Connects to local MT5 on macOS/Windows via ApexBridge.mq5 socket (127.0.0.1:15555)
  #   - "mt5_windows"     : Native MetaTrader5 Python package on Windows
  active_broker: "mt5_mac_socket"
  bridge_token: "apex_secret_2026"          # Secret token for MT5 bridge authentication (matches ApexBridge.mq5 default)

  mac_socket:
    host: "127.0.0.1"
    port: 15555
    timeout_sec: 5.0
    reconnect_interval_sec: 3.0
    buffer_size: 65536

  windows_mt5:
    terminal_path: ""       # Leave empty for default MT5 installation path
    login: 0                # Account number (integer)
    password: ""            # Account password
    server: ""              # Broker server name (e.g., "Exness-Real10", "ICMarkets-Live01")
    timeout_ms: 60000

  paper_sim:
    initial_balance: 10.00  # Default small test budget ($10.00 or 1,000 cents)
    currency: "USD"
    leverage: 500
    slippage_points: 2      # Simulated slippage on market executions
    spread_points: 25       # Typical Gold spread (~0.25 on XAUUSD)

# ------------------------------------------------------------------------------
# Asset & Trading Parameters
# ------------------------------------------------------------------------------
trading:
  primary_symbol: "XAUUSD"
  # Allowed universe (Gold + major USD pairs)
  allowed_symbols:
    - "XAUUSD"
    - "XAUUSDc"
    - "XAUUSDm"
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"

  # Explicit Live Trading Opt-In:
  # When false, real broker execution is disabled and the engine defaults to paper simulation/scanner.
  live_trading_enabled: true

  # Protect Manually Opened MT5 Positions:
  # When true, the bot dynamically trails, protects, and manages trades opened manually as well.
  manage_manual_positions: true

  # Execution Modes:
  #   - "scanner"    : Read-only live technical scanner & confluence analyzer (Default safe mode)
  #   - "confirm"    : Emits alerts & prepares 1-click execution in the Web UI
  #   - "full_auto"  : Executes live trades immediately when score threshold is crossed (requires live_trading_enabled: true)
  execution_mode: "full_auto"

  # Strategy Transmission Modes:
  #   - "auto_adaptive" : Flagship Smart Auto-Pilot Brain (Default: auto-dials 1%-100% every 5s)
  #   - "cautious"      : Min score 76/100 (Smart Sniper, 35% scroller)
  #   - "standard"      : Min score 68/100 (Balanced, 55% scroller)
  #   - "aggressive"    : Min score 60/100 (Active Momentum, 75% scroller)
  #   - "hyper"         : Min score 52/100 (Hyper Hit-and-Run, 92% scroller)
  strategy_mode: "auto_adaptive"

  # Account Sizing & Risk Configuration:
  #   - "micro"    : Default for small/demo MT5 accounts (0.01 min lot, safe margin)
  #   - "cent"     : Budget $10.00 = 1,000 USC (For dedicated cent accounts like XAUUSDc)
  #   - "standard" : Standard account sizing
  #   - "paper"    : Simulated virtual money
  account_type: "micro"
  budget_usd: 10.00
  risk_per_trade_pct: 10.0  # Dynamic risk per trade (enables 0.02 - 0.05 lot scaling on $80-$150 accounts)
  risk_profile: "aggressive" # "conservative", "balanced", or "aggressive"
  compounding_enabled: true # Automatically scales budget as balance grows

  # Risk Guards & Circuit Breakers:
  circuit_breaker_enabled: false       # Completely disables circuit breaker - trading is always enabled
  max_open_positions: 1                # Single high-conviction position at a time to prevent double-dipping exposure
  max_daily_losses: 0                  # 0 = disabled (no daily loss limit)
  max_consecutive_losses: 0            # 0 = disabled (no consecutive loss pause)
  max_daily_drawdown_pct: 0.0          # 0.0 = disabled (no daily drawdown cutoff)
  correlation_guard: true              # Block opposing/redundant USD exposure across pairs
  post_loss_buffer_seconds: 0.0        # Cooldown buffer disabled
  anti_revenge_window_seconds: 45.0    # Structural window preventing repeating same losing trade at same level
  predictive_scratch_enabled: true     # Closes trades at breakeven when market reverses or cuts early with tiny budget scratch
  micro_budget_loss_cap_pct: 15.0      # Max loss % relative to budget for mitigation scratch (e.g. 15% of $2.56 = $0.38)
  max_mitigation_loss_r: 0.40          # Max floating R loss for early structural mitigation cut (saves 60-80% of SL)

  # Institutional Planned Limits Engine (Disabled to prioritize immediate MARKET executions):
  limits:
    enabled: false            # Disabled to prevent missed entries on pullbacks
    auto_place: false         # Strictly false: execute confirmed signals at MARKET immediately
    min_score: 60             # Minimum confluence score required to place limit order
    min_distance_points: 0.50 # Minimum distance from current market price (points)
    max_distance_points: 4.50 # Maximum distance to place pending limit (points)
    timeout_seconds: 90.0     # Time to cancel limit order if not filled
    max_drift_points: 3.00    # If price moves away by > 3.00 pts, cancel limit

# ------------------------------------------------------------------------------
# Confluence & Strategy Scoring Engine (100-Point System)
# ------------------------------------------------------------------------------
strategy:
  thresholds:
    aggressive: 60
    balanced: 68
    sniper: 82

  risk_reward:
    tier_1_sniper: 4.5
    tier_2_balanced: 3.5
    tier_3_aggressive: 2.8

  trade_management:
    breakeven_trigger_r:
      sniper: 1.0     # Move SL to BE at +1.0R
      balanced: 0.85  # Move SL to BE at +0.85R
      aggressive: 0.80 # Move SL to BE at +0.80R
    breakeven_buffer_points: 3 # Pad BE slightly above entry to cover broker commission
    trailing_trigger_r: 1.8    # Start trailing SL after +1.8R floating profit
    trailing_step_r: 0.6       # Trail stop in 0.6R increments behind structure

  weights:
    h1_macro_bias: 20
    m15_session_wave: 25
    m5_setup_structure: 30
    m1_sniper_trigger: 25

  timeframes:
    macro: "1H"
    wave: "15m"
    setup: "5m"
    trigger: "1m"

# ------------------------------------------------------------------------------
# Millisecond News & Tick-Velocity Reactor
# ------------------------------------------------------------------------------
news_reactor:
  enabled: true
  calendar_refresh_minutes: 30
  high_impact_only: true
  currencies: ["USD", "XAU"]

  # Pre-News & Post-News Lockout
  pre_news_freeze_seconds: 90        # Pre-News Spread Buffer (90s before event)
  post_news_freeze_seconds: 15       # Fast 15s post-release buffer before momentum capture
  lock_breakeven_on_open_trades: true # Move open profitable trades to BE before news
  block_on_calendar_unavailable: false # If true, blocks new trades when economic calendar cannot be reached

  # Post-News Momentum Capture
  post_news_cooldown_seconds: 3      # Wait 3s after release for initial spike
  post_news_momentum_window_sec: 300 # Trade institutional follow-through wave for 5m

  # 50ms Tick-Velocity & Spread Protections
  tick_velocity_window_ms: 800
  tick_density_multiplier: 3.0      # >3x average ticks/sec triggers impulse mode
  max_spread_multiplier: 2.5        # Freeze if spread > 2.5x normal average

# ------------------------------------------------------------------------------
# Data Hub & Historical Caching
# ------------------------------------------------------------------------------
data_hub:
  database_path: "data/market_history.db"
  warmup_bars:
    h1_days: 90
    m15_days: 30
    m5_days: 14
    m1_days: 7
  offline_cache_enabled: true

# ------------------------------------------------------------------------------
# Telemetry & Telegram Notifications
# ------------------------------------------------------------------------------
telegram:
  enabled: false
  bot_token: ""                     # Set your Telegram Bot Token
  chat_id: ""                       # Set your Chat ID
  notify_on_signals: true
  notify_on_execution: true
  notify_on_breakeven: true
  notify_on_tp_sl: true

# ------------------------------------------------------------------------------
# Web Dashboard UI
# ------------------------------------------------------------------------------
ui:
  host: "127.0.0.1"
  port: 8000
  theme: "dark"
  ws_broadcast_interval_ms: 250     # 4 FPS telemetry refresh for charts

